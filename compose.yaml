
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cig
      POSTGRES_USER: cig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diatur}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cig -d cig"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY belum diatur}
      DATABASE_URL: postgresql+psycopg2://cig:${POSTGRES_PASSWORD}@db:5432/cig
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://cig:${POSTGRES_PASSWORD}@db:5432/cig
      SCAN_MODEL_PATH: /app/models/yolo/best.pt
      YOLO_CONFIG_DIR: /tmp/ultralytics
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models/yolo:/app/models/yolo:ro
      - scan_data:/app/instance
      - content_uploads:/app/app/static/uploads
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
  scan_data:
  content_uploads:
