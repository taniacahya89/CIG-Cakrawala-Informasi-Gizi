<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cakrawala Informasi Gizi — Platform edukasi gizi interaktif berbasis web.">
    <title>{% block title %}{{ app_short_name }}{% endblock %} — {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/features.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-[#FFF5F5] text-gray-900 font-sans">
    {% include 'components/navbar.html' %}

    {% include 'components/flash_messages.html' %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% include 'components/footer.html' %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
